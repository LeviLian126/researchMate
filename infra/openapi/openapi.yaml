    UploadUrlResponse:
      properties:
        document_id:
          type: string
          format: uuid
          title: Document Id
        upload_url:
          type: string
          maxLength: 4096
          minLength: 1
          title: Upload Url
        r2_object_key:
          type: string
          maxLength: 512
          minLength: 16
          title: R2 Object Key
        expires_in_seconds:
          type: integer
          maximum: 900.0
          minimum: 60.0
          title: Expires In Seconds
      type: object
      required:
      - document_id
      - upload_url
      - r2_object_key
      - expires_in_seconds
      title: UploadUrlResponse
      description: Return a bounded direct-upload reservation and storage identity.
    WorkflowRunRecord:
      properties:
        run_id:
          type: string
          format: uuid
