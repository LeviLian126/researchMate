      type: object
      required:
      - section_id
      - section_key
      - position
      - heading
      - body_markdown
      - evidence_snapshot
      - validation_status
      title: ReportSectionRecord
      description: Represent one evidence-snapshotted report section.
    ReportSummary:
      properties:
        report_id:
          type: string
          format: uuid
          title: Report Id
        source_run_id:
          type: string
          format: uuid
          title: Source Run Id
        title:
          type: string
          title: Title
        status:
          type: string
          enum:
          - draft
          - review
          - published
          - invalidated
          title: Status
        revision:
          type: integer
          minimum: 1.0
          title: Revision
        validation_status:
          type: string
          enum:
          - pending
          - passed
          - failed
          - retrying
          title: Validation Status
        affected_section_count:
          type: integer
          minimum: 0.0
          title: Affected Section Count
        generated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Generated At
      type: object
      required:
      - report_id
      - source_run_id
      - title
      - status
      - revision
      - validation_status
      - affected_section_count
      title: ReportSummary
      description: Summarize report revision and validation state.
    ResearchRunAccepted:
      properties:
        run_id:
          type: string
          format: uuid
          title: Run Id
        status:
          type: string
          const: pending
          title: Status
          default: pending
        status_url:
          type: string
          title: Status Url
        events_url:
          type: string
          title: Events Url
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - run_id
      - status_url
      - events_url
      - created_at
      title: ResearchRunAccepted
      description: Acknowledge creation of an asynchronous research run.
    ResearchRunCreate:
      properties:
        project_id:
          type: string
          format: uuid
          title: Project Id
        research_goal:
          type: string
          maxLength: 12000
          minLength: 20
          title: Research Goal
        source_scope:
          $ref: '#/components/schemas/SourceScope'
        pipeline_version_id:
          type: string
          format: uuid
          title: Pipeline Version Id
        review_policy:
          type: string
          enum:
          - strict
          - balanced
          title: Review Policy
          default: strict
        max_cost_usd:
          anyOf:
          - type: number
            maximum: 25.0
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Max Cost Usd
      type: object
      required:
      - project_id
      - research_goal
      - pipeline_version_id
      title: ResearchRunCreate
      description: Validate a request to start a bounded research workflow.
    RunSourcesResponse:
      properties:
        run_id:
          type: string
          format: uuid
          title: Run Id
        summary:
          $ref: '#/components/schemas/SourceSummary'
        citations:
          items:
            $ref: '#/components/schemas/Citation'
          type: array
          maxItems: 120
          title: Citations
      type: object
      required:
      - run_id
      - summary
      title: RunSourcesResponse
      description: Return source counts and validated citations for one run.
    RuntimeRerankConfig:
      properties:
        provider:
          type: string
          enum:
          - auto
          - qdrant
          - nvidia
          - deterministic
          title: Provider
        version:
          type: integer
          minimum: 1.0
          title: Version
        updated_at:
          type: string
          format: date-time
          title: Updated At
        updated_by:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Updated By
      type: object
      required:
      - provider
      - version
      - updated_at
      title: RuntimeRerankConfig
      description: Expose the versioned rerank provider selected at runtime.
    RuntimeRerankConfigUpdate:
      properties:
        provider:
          type: string
          enum:
          - auto
          - qdrant
          - nvidia
          - deterministic
          title: Provider
        expected_version:
          type: integer
          minimum: 1.0
          title: Expected Version
      additionalProperties: false
      type: object
      required:
      - provider
      - expected_version
      title: RuntimeRerankConfigUpdate
      description: Validate an optimistic update to the runtime rerank provider.
    SourceScope:
      properties:
        document_ids:
          items:
            type: string
            format: uuid
          type: array
          maxItems: 200
          title: Document Ids
        allow_web:
          type: boolean
          title: Allow Web
          default: false
      type: object
      title: SourceScope
      description: Constrain the documents and web access available to a research
        run.
    SourceSummary:
      properties:
        local_chunks:
          type: integer
          maximum: 50.0
          minimum: 0.0
          title: Local Chunks
          default: 0
        web_pages:
          type: integer
          maximum: 20.0
          minimum: 0.0
          title: Web Pages
          default: 0
      type: object
      title: SourceSummary
      description: Summarize the evidence mix returned with an answer.
    SourceType:
      type: string
      enum:
      - local_doc
      - web_page
      title: SourceType
      description: Identify whether cited evidence is local or web-derived.
    TaskType:
      type: string
      enum:
      - answer
      - quiz
      title: TaskType
      description: Select the high-level operation requested from the query pipeline.
    ToolCallTrace:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        tool_name:
          type: string
          maxLength: 120
          minLength: 2
          title: Tool Name
        input_summary:
          additionalProperties: true
          type: object
          title: Input Summary
        output_summary:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Output Summary
        status:
          type: string
          title: Status
        latency_ms:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Latency Ms
        error_message:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Error Message
      type: object
      required:
      - id
      - tool_name
      - input_summary
      - status
