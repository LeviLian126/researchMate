      description: Summarize a tool call without exposing raw sensitive payloads.
    UploadCompleteRequest:
      properties:
        checksum_sha256:
          anyOf:
          - type: string
            pattern: ^[0-9a-fA-F]{64}$
          - type: 'null'
          title: Checksum Sha256
        extracted_text:
          anyOf:
          - type: string
            maxLength: 200000
          - type: 'null'
          title: Extracted Text
          description: Local development fallback. Production worker should extract
            text from R2.
      additionalProperties: false
      type: object
      title: UploadCompleteRequest
      description: Accept the upload checksum and the explicitly local-only extraction
        fallback.
    UploadUrlRequest:
      properties:
        project_id:
          type: string
          format: uuid
          title: Project Id
        conversation_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Conversation Id
        filename:
          type: string
          maxLength: 240
          minLength: 1
          title: Filename
        file_type:
          type: string
          enum:
          - pdf
          - docx
          - pptx
          title: File Type
        mime_type:
          type: string
          maxLength: 120
          minLength: 3
          title: Mime Type
        size_bytes:
          type: integer
          maximum: 26214400.0
          exclusiveMinimum: 0.0
          title: Size Bytes
      additionalProperties: false
      type: object
      required:
      - project_id
      - filename
      - file_type
      - mime_type
      - size_bytes
