components:
  schemas:
    AskRequest:
      properties:
        project_id:
          type: string
          format: uuid
          title: Project Id
        conversation_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Conversation Id
        message:
          type: string
          maxLength: 8000
          minLength: 1
          title: Message
        web_enabled:
          type: boolean
          title: Web Enabled
          default: false
      additionalProperties: false
      type: object
      required:
      - project_id
      - message
      title: AskRequest
      description: Accept one bounded chat intent and optional evidence boundaries.
    AskResponse:
      properties:
        run_id:
          type: string
          format: uuid
          title: Run Id
        conversation_id:
          type: string
          format: uuid
          title: Conversation Id
        answer:
          type: string
          maxLength: 16000
          minLength: 1
          title: Answer
        sources:
          $ref: '#/components/schemas/SourceSummary'
        citations:
          items:
            $ref: '#/components/schemas/Citation'
          type: array
          maxItems: 80
          title: Citations
        trace_id:
          type: string
          format: uuid
          title: Trace Id
        validation_status:
          type: string
          enum:
          - passed
          - failed
          - retrying
          title: Validation Status
        rerank_degraded:
          type: boolean
          title: Rerank Degraded
          default: false
        retrieval_degraded:
          type: boolean
          title: Retrieval Degraded
          default: false
        web_degraded:
          type: boolean
          title: Web Degraded
          default: false
        summary_degraded:
          type: boolean
          title: Summary Degraded
          default: false
        fallback_reason:
          anyOf:
          - type: string
            maxLength: 300
          - type: 'null'
          title: Fallback Reason
      type: object
      required:
      - run_id
      - conversation_id
      - answer
      - sources
      - trace_id
      - validation_status
      title: AskResponse
      description: Return persisted Ask identifiers, evidence, and explicit degradation
        state.
    Citation:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        source_type:
          $ref: '#/components/schemas/SourceType'
        document_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Document Id
        chunk_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Chunk Id
        page_no:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Page No
        slide_no:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Slide No
        section_title:
          anyOf:
          - type: string
            maxLength: 300
          - type: 'null'
          title: Section Title
        url:
          anyOf:
          - type: string
            maxLength: 2048
          - type: 'null'
          title: Url
        quote:
          type: string
          maxLength: 1200
          minLength: 1
          title: Quote
        claim_id:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Claim Id
      type: object
      required:
      - id
      - source_type
      - quote
      title: Citation
      description: Represent a server-validated evidence reference exposed to clients.
    ClaimListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ClaimSummary'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      type: object
      required:
      - items
      title: ClaimListResponse
      description: Wrap a cursor-compatible claim listing.
    ClaimRelationListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ClaimRelationSummary'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      type: object
      required:
      - items
      title: ClaimRelationListResponse
      description: Wrap a cursor-compatible claim-relation listing.
    ClaimRelationSummary:
      properties:
        source_claim_id:
          type: string
          format: uuid
          title: Source Claim Id
        target_claim_id:
          type: string
          format: uuid
          title: Target Claim Id
        relation:
          type: string
          enum:
          - supports
          - contradicts
          - duplicates
          title: Relation
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
        rationale_summary:
          anyOf:
          - type: string
          - type: 'null'
          title: Rationale Summary
        source_text:
          type: string
          title: Source Text
        target_text:
          type: string
          title: Target Text
      type: object
      required:
      - source_claim_id
      - target_claim_id
      - relation
      - confidence
      - source_text
      - target_text
      title: ClaimRelationSummary
      description: Describe a validated relationship between two claims.
    ClaimSummary:
      properties:
        claim_id:
          type: string
          format: uuid
          title: Claim Id
        text:
          type: string
          title: Text
        stance:
          type: string
          enum:
          - supports
          - opposes
          - neutral
          title: Stance
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
        review_status:
          type: string
          enum:
          - pending
          - accepted
          - edited
          - rejected
          - invalidated
          title: Review Status
        evidence_count:
          type: integer
          minimum: 0.0
          title: Evidence Count
        support_count:
          type: integer
          minimum: 0.0
          title: Support Count
        contradiction_count:
          type: integer
          minimum: 0.0
          title: Contradiction Count
        duplicate_count:
          type: integer
          minimum: 0.0
          title: Duplicate Count
        source_version:
          type: integer
          minimum: 1.0
          title: Source Version
      type: object
      required:
      - claim_id
      - text
      - stance
      - confidence
      - review_status
      - evidence_count
      - support_count
      - contradiction_count
      - duplicate_count
      - source_version
      title: ClaimSummary
      description: Summarize one evidence-backed claim and its review state.
    ConversationCreate:
      properties:
        title:
          type: string
          maxLength: 120
          minLength: 1
          title: Title
          default: New chat
      additionalProperties: false
      type: object
      title: ConversationCreate
      description: Validate a request to create a named conversation.
    ConversationListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ConversationSummary'
          type: array
          maxItems: 100
          title: Items
      type: object
      title: ConversationListResponse
      description: Wrap a bounded conversation listing.
    ConversationMessage:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        conversation_id:
          type: string
          format: uuid
          title: Conversation Id
        role:
          type: string
          enum:
          - user
          - assistant
          title: Role
        content:
          type: string
          maxLength: 16000
          minLength: 1
          title: Content
        citations:
          items:
            $ref: '#/components/schemas/Citation'
          type: array
          maxItems: 80
          title: Citations
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - conversation_id
      - role
      - content
      - created_at
      title: ConversationMessage
      description: Represent a persisted user or assistant conversation message.
    ConversationMessagesResponse:
      properties:
        conversation_id:
          type: string
          format: uuid
          title: Conversation Id
        messages:
          items:
            $ref: '#/components/schemas/ConversationMessage'
          type: array
          maxItems: 200
          title: Messages
      type: object
      required:
      - conversation_id
      title: ConversationMessagesResponse
      description: Wrap bounded chronological messages for one conversation.
    ConversationSummary:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        project_id:
          type: string
          format: uuid
          title: Project Id
        title:
          type: string
          maxLength: 120
          minLength: 1
          title: Title
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - project_id
      - title
      - created_at
      - updated_at
      title: ConversationSummary
      description: Represent conversation metadata in owner-scoped listings.
    ConversationUpdate:
      properties:
        title:
          type: string
          maxLength: 120
          minLength: 1
          title: Title
      additionalProperties: false
      type: object
      required:
      - title
      title: ConversationUpdate
      description: Validate a request to rename an existing conversation.
    CurrentUser:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        email:
          anyOf:
          - type: string
            maxLength: 320
          - type: 'null'
          title: Email
        role:
          type: string
          enum:
          - user
          - developer
          - admin
          title: Role
          default: user
      type: object
      required:
      - id
      title: CurrentUser
      description: Represent the authenticated identity passed across API boundaries.
    DeveloperTrace:
      properties:
        trace_id:
          type: string
          format: uuid
          title: Trace Id
        user_id:
          type: string
          format: uuid
          title: User Id
        project_id:
          type: string
          format: uuid
          title: Project Id
        run_id:
          type: string
          format: uuid
          title: Run Id
        execution_plan:
          $ref: '#/components/schemas/ExecutionPlan'
        router_reason:
          type: string
          maxLength: 2000
          title: Router Reason
        retrieved_chunks:
          items:
            additionalProperties: true
            type: object
          type: array
          maxItems: 80
          title: Retrieved Chunks
        tool_calls:
          items:
            $ref: '#/components/schemas/ToolCallTrace'
          type: array
          maxItems: 40
          title: Tool Calls
        validation_result:
          additionalProperties: true
          type: object
          title: Validation Result
        latency_ms:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Latency Ms
        token_usage:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Token Usage
        errors:
          items:
            type: string
          type: array
          maxItems: 20
          title: Errors
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - trace_id
      - user_id
      - project_id
      - run_id
      - execution_plan
      - router_reason
      - validation_result
      - created_at
      title: DeveloperTrace
      description: Aggregate privacy-bounded execution diagnostics for administrators.
