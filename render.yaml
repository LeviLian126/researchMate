# Defines the single sleeping Render Free service and its managed dependency boundary.
envVarGroups:
  - name: researchmate-backend
    envVars:
      - key: APP_ENV
        value: preview
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OBJECT_STORAGE_ENDPOINT_URL
        value: https://tjdkdganvszqawxspveg.storage.supabase.co/storage/v1/s3
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        value: researchmate-dev
      - key: OBJECT_STORAGE_REGION
        value: ca-central-1
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: researchmate_chunks
      - key: QDRANT_RERANK_COLLECTION
        value: researchmate_chunks_v2
      - key: QDRANT_RERANK_MODEL
        value: answerdotai/answerai-colbert-small-v1
      - key: QDRANT_RERANK_MODEL_IS_FREE
        value: "false"
      - key: QDRANT_RERANK_DIMENSION
        value: "96"
      - key: RERANK_PROVIDER_DEFAULT
        value: auto
      - key: NVIDIA_RERANK_BASE_URL
        value: https://integrate.api.nvidia.com
      - key: NVIDIA_RERANK_MODEL
        value: nvidia/llama-nemotron-rerank-1b-v2
      - key: CHAT_HISTORY_TOKEN_BUDGET
        value: "5000"
      - key: CHAT_RECENT_TOKEN_BUDGET
        value: "3500"
      - key: CHAT_SUMMARY_TOKEN_BUDGET
        value: "1500"
      - key: CHAT_SUMMARY_TRIGGER_TOKENS
        value: "8000"
      - key: LLM_PROVIDER
        value: nvidia
      - key: EMBEDDING_PROVIDER
        value: nvidia
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_MODEL
        value: z-ai/glm-5.2
      - key: NVIDIA_EMBEDDING_MODEL
        value: nvidia/nv-embed-v1
      - key: EMBEDDING_DIMENSION
        value: "4096"
      - key: WEB_SEARCH_PROVIDER
        value: tavily
      - key: TAVILY_API_KEY
        sync: false
      - key: TAVILY_BASE_URL
        value: https://api.tavily.com
      - key: SUPABASE_URL
        value: https://tjdkdganvszqawxspveg.supabase.co
      - key: ACCESS_TOKEN_ISSUER
        value: https://tjdkdganvszqawxspveg.supabase.co/auth/v1
      - key: LANGFUSE_ENABLED
        value: "true"
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        value: https://cloud.langfuse.com
      - key: OTEL_ENABLED
        value: "true"
      - key: OTEL_SERVICE_NAME
        value: researchmate-api
      - key: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
        value: https://cloud.langfuse.com/api/public/otel/v1/traces
      - key: OTEL_EXPORTER_OTLP_TRACES_HEADERS
        sync: false
      - key: DOCLING_ARTIFACTS_PATH
        value: /opt/docling/models
      - key: LANGGRAPH_STRICT_MSGPACK
        value: "true"
      - key: RAGAS_DO_NOT_TRACK
        value: "true"
      - key: RUN_SCHEMA_MIGRATIONS
        value: "1"

services:
  - type: web
    name: researchmate-backend-dev
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./workers/ai-worker/Dockerfile
    dockerContext: .
    dockerCommand: python -m researchmate_worker.render_combined
    healthCheckPath: /api/v1/healthz
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: researchmate-backend
      - key: AUTH_MODE
        value: supabase
      - key: REPOSITORY_BACKEND
        value: postgres
      - key: CORS_ALLOWED_ORIGINS
        value: https://research-mate-web.vercel.app
