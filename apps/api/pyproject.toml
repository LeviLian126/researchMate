[project]
name = "researchmate-api"
version = "0.1.0"
description = "Production-oriented Agentic RAG API for the ResearchMate engineering portfolio"
requires-python = ">=3.13"
dependencies = [
  "boto3>=1.42.0",
  "fastapi>=0.128.0",
  "httpx>=0.28.0,<1",
  "mcp>=1.27,<2",
  "langfuse>=4,<5",
  "langgraph>=1.2,<2",
  "openai>=1.68.0,<3",
  "opentelemetry-api>=1.38,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
  "opentelemetry-instrumentation-fastapi>=0.59b0,<1",
  "opentelemetry-sdk>=1.38,<2",
  "pydantic-settings>=2.12.0",
  "pydantic>=2.12.0",
  "python-magic>=0.4.27 ; sys_platform != 'win32'",
  "PyJWT[crypto]>=2.10.0",
  "qdrant-client>=1.18.0,<1.19",
  "redis>=6,<7",
  "slowapi>=0.1.9",
  "psycopg[binary]>=3.2.0",
  "sqlalchemy>=2.0.46",
  "uvicorn>=0.40.0",
  "python-magic-bin>=0.4.14 ; sys_platform == 'win32'",
]

[build-system]
requires = ["hatchling>=1.29,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/researchmate_api"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Mirror root ruff.toml select set: defaults plus import sorting (I) and
# pyupgrade (UP), which encourages PEP 604 annotations once
# `from __future__ import annotations` is present (required project-wide).
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "UP",
]
ignore = [
  # FastAPI dependency injection is expressed through Depends(...) defaults.
  "B008",
  # Readiness and provider boundaries fail closed for unknown SDK exceptions.
  "BLE001",
  # Existing enums intentionally use (str, Enum) for cross-version behavior.
  # Migrating to enum.StrEnum is a separate modernization beyond this task.
  "UP042",
]

[tool.ruff.lint.pyupgrade]
# Project policy (see AGENTS.md): every module starts with
# `from __future__ import annotations`. Keep runtime typing helpers intact so
# ruff only rewrites annotation syntax, never runtime isinstance/TypeGuard uses.
keep-runtime-typing = true
