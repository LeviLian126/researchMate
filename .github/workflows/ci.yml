name: researchmate-ci

on:
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: researchmate-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: python-quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install locked Python dependencies
        run: uv sync --frozen --all-packages --group dev
      - name: Run Python tests and coverage
        run: npm run test:python
      - name: Run Python type checks
        run: npm run check:types
      - name: Run Python lint and repository contracts
        run: npm run check:lint && npm run check:openapi && npm run check:migrations

  web-quality:
    name: web-quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Run web unit tests and coverage
        run: npm run test:web
      - name: Build web application
        run: npm run check:web
      - name: Audit production dependencies
        run: npm run check:audit

  browser-e2e:
    name: browser-e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser acceptance flow
        run: npm run test:e2e
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  container-quality:
    name: container-quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfiles
        run: |
          docker run --rm -i hadolint/hadolint:v2.15.1-debian hadolint --ignore DL3008 - < apps/api/Dockerfile
          docker run --rm -i hadolint/hadolint:v2.15.1-debian hadolint --ignore DL3008 - < workers/ai-worker/Dockerfile
      - uses: docker/setup-buildx-action@v4
      - name: Validate API Docker build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          push: false
          tags: researchmate-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate worker dependency image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: workers/ai-worker/Dockerfile
          target: dependencies
          load: true
          push: false
          tags: researchmate-worker-dependencies:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan API image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.73.0 image \
            --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL researchmate-api:ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.73.0 image \
            --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL researchmate-worker-dependencies:ci

  ci-success:
    name: ci-success
    if: always()
    needs: [python-quality, web-quality, browser-e2e, container-quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify every required gate passed
        env:
          PYTHON_RESULT: ${{ needs.python-quality.result }}
          WEB_RESULT: ${{ needs.web-quality.result }}
          E2E_RESULT: ${{ needs.browser-e2e.result }}
          CONTAINER_RESULT: ${{ needs.container-quality.result }}
        run: |
          test "$PYTHON_RESULT" = success
          test "$WEB_RESULT" = success
          test "$E2E_RESULT" = success
          test "$CONTAINER_RESULT" = success
